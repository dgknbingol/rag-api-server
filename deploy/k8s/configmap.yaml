apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-api-config
  namespace: eislam
data:
  SPRING_PROFILES_ACTIVE: "prod"

  # Postgres ve Qdrant Kubernetes'te DEGIL — sunucuda Docker Compose ile calisiyor.
  # 172.17.0.1 host'un docker0 kopru adresi: pod'lardan erisilebilir, internetten erisilemez.
  # Compose tarafinda bu adrese port yayinlanmis olmali (bkz. README).
  # Adres degisirse yalnizca bu iki satiri guncelle.
  SPRING_DATASOURCE_URL: "jdbc:postgresql://172.17.0.1:5432/aislam"
  QDRANT_BASE_URL: "http://172.17.0.1:6333"

  # Konteyner bellek limitinin %75'ini heap olarak kullan.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
