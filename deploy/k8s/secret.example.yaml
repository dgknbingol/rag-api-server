# ORNEK DOSYA — gercek degerlerle doldurulmus halini ASLA depoya commit etme.
#
# Kullanim:
#   cp secret.example.yaml secret.yaml
#   # secret.yaml icini doldur (degerler duz metin, stringData otomatik base64'ler)
#   sudo k3s kubectl apply -f secret.yaml
#
# Degerleri sunucudaki mevcut rag-api-server/.env dosyasindan al.
apiVersion: v1
kind: Secret
metadata:
  name: rag-api-secret
  namespace: dogukan-test
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "REPLACE_ME"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
  DEEPSEEK_API_KEY: "REPLACE_ME"
  APP_AUTH_JWT_SECRET: "REPLACE_ME"
  # RevenueCat dashboard'daki Authorization header'i ile birebir ayni olmali.
  # Premium henuz kapali oldugu icin bos birakilabilir.
  REVENUECAT_WEBHOOK_AUTH: ""
  # Firebase service account JSON (tek satir; " icinde \" veya | blok kullanin).
  FIREBASE_CREDENTIALS_JSON: ""
  # iOS APNs (opsiyonel; Android-first ise bos birakilabilir)
  APNS_KEY_PEM: ""
  APNS_KEY_ID: ""
  APNS_TEAM_ID: ""
  APNS_BUNDLE_ID: "net.eislam.app"
  APNS_PRODUCTION: "true"
