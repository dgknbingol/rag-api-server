# cert-manager kurulduktan SONRA uygulanir.
# E-postayi kendi adresinle degistir: sertifika son kullanma uyarilari buraya gider.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: info@e-islam.net
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
