# e-islam.net — statik yasal sayfalar
# api.e-islam.net ayrı bir server bloğunda kalır.

server {
    listen 80;
    listen [::]:80;
    server_name e-islam.net www.e-islam.net;

    root /var/www/e-islam.net;
    index index.html;

    location = /gizlilik {
        try_files /gizlilik.html =404;
    }

    location = /kosullar {
        try_files /kosullar.html =404;
    }

    # AdMob uygulama sahipligi dogrulamasi.
    # Google crawler'i text/plain bekler; dosya yoksa index.html yerine gercek 404 donmeli.
    location = /app-ads.txt {
        default_type text/plain;
        try_files /app-ads.txt =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /styles.css {
        add_header Cache-Control "public, max-age=86400";
    }
}
